
[project]
name = "therabot"
version = "0.1.0"
description = "An AI chatbot prototype with a Flask backend and Streamlit frontend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask",
    "transformers",
    "torch",
    "streamlit",
    "requests",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["app.py", "chatbot.py", "frontend.py"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
